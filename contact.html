<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="description" content="Contact AKAH Logistics for fast, reliable courier and delivery services.">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AKAH Logistics | Contact</title>

   <!-- Font Awesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

   <!-- Bootstrap -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

   <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
   <img src="images/logo1.png" width="1500" height="442" 
      alt="AKAH Logistics Logo" class="logo">

   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="index.html">AKAH Logistics</a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav">
         <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
         <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item active"><a class="nav-link" href="contact.html">Contact</a></li>
         </ul>
      </div>
   </nav>
</header>

<main class="container mt-4">

   <!-- HERO IMAGE -->
   <div class="row mb-4">
      <div class="col-12">
         <img src="images/fast-delivery.webp" class="img-fluid rounded shadow" alt="Fast delivery">
      </div>
   </div>

   <!-- CONTACT CONTENT -->
   <div class="row">

      <!-- CONTACT INFO -->
      <div class="col-md-5 mb-4">
         <h2>Get In Touch</h2>
         <p>We're here to help with delivery requests, questions, or business inquiries.</p>

         <p class="mt-4">
            <i class="fa-solid fa-envelope mr-2 text-primary"></i>
            <a href="mailto:akahlogistics@gmail.com">akahlogistics@gmail.com</a>
         </p>

         <p>
            <i class="fa-solid fa-phone mr-2 text-success"></i>
            <a href="tel:6518880715">651-888-0715</a>
         </p>

         <p>
            <i class="fa-solid fa-comment mr-2 text-info"></i>
            <a href="sms:6518880715">Text Us</a>
         </p>
      </div>

      <!-- CONTACT FORM -->
      <div class="col-md-7">
         <div class="card shadow">
            <div class="card-body">
               <h3 class="text-center mb-4">Send a Message</h3>

               <form>
                  <div class="form-group">
                     <label>Your Name</label>
                     <input type="text" class="form-control" required>
                  </div>

                  <div class="form-group">
                     <label>Your Email</label>
                     <input type="email" class="form-control" required>
                  </div>

                  <div class="form-group">
                     <label>Your Message</label>
                     <textarea class="form-control" rows="5" required></textarea>
                  </div>

                  <button type="submit" class="btn btn-primary btn-block">Send Message</button>
               </form>

            </div>
         </div>
      </div>

   </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
   <p>&copy; 2025 AKAH Logistics. All rights reserved.</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
